name: Deploy to GitHub Pages
# Yalelux 上线版需要后端（server/），GitHub Pages 只能放静态文件，所以不再自动发布；
# 部署见 docs/deploy-china.md。保留手动触发，仅用于发布 v0 静态原型（main 分支旧版本）。
# The launch version needs the Node backend; Pages can't run it, so this is manual-only now.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: touch web/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          force_orphan: true
